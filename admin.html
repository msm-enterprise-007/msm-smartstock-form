<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSM SmartStock - Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="admin-container" id="adminApp">
        <!-- Login -->
        <div id="loginScreen" class="admin-login">
            <h1>🔐 Administration</h1>
            <p>MSM SmartStock - Formulaire</p>
            <input type="password" id="adminPassword" placeholder="Mot de passe">
            <button onclick="login()" class="btn-submit">Se connecter</button>
            <div id="loginError" style="color:red;margin-top:10px;"></div>
        </div>

        <!-- Dashboard -->
        <div id="dashboardScreen" style="display:none;">
            <div class="admin-header">
                <h1>📊 Réponses du formulaire</h1>
                <button onclick="logout()" class="btn-save">Déconnexion</button>
            </div>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Entreprise</th>
                            <th>Responsable</th>
                            <th>Email</th>
                            <th>Statut</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="responsesTable">
                        <tr><td colspan="7" style="text-align:center;">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
